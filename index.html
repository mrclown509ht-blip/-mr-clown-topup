<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mr Clown Top Up Gaming — Recharges jeux mobiles</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --bg: #ffffff;
    --bg-soft: #f7f7fb;
    --accent: #7c3aed;
    --accent-dark: #6d28d9;
    --gold: #fbbf24;
    --line: #e5e7eb;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 20px; max-width: 1100px; margin: 0 auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; }
  .logo .mask { font-size: 1.6rem; }
  .logo small { display: block; font-size: .68rem; font-weight: 600; color: var(--accent); letter-spacing: .08em; }
  nav { display: flex; gap: 22px; }
  nav a { color: var(--ink); text-decoration: none; font-size: .92rem; font-weight: 500; }
  nav a:hover { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .lang-toggle {
    border: 1px solid var(--line); background: var(--bg-soft);
    border-radius: 999px; overflow: hidden; display: flex; font-size: .8rem; font-weight: 700;
  }
  .lang-toggle button {
    border: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--muted);
  }
  .lang-toggle button.active { background: var(--ink); color: #fff; }
  .cart-btn {
    position: relative; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 700;
    padding: 10px 16px; border-radius: 999px; font-size: .9rem;
  }
  .cart-btn:hover { background: var(--accent-dark); }
  .cart-count {
    position: absolute; top: -6px; right: -6px;
    background: var(--gold); color: var(--ink);
    font-size: .7rem; font-weight: 800;
    min-width: 20px; height: 20px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
  }

  /* Hero */
  .hero { padding: 72px 0 56px; text-align: center; background: linear-gradient(180deg, #f5f3ff 0%, #fff 100%); }
  .hero .badge {
    display: inline-block; background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font-size: .8rem; font-weight: 600;
    color: var(--accent); margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -.02em; max-width: 720px; margin: 0 auto 16px; }
  .hero p { color: var(--muted); font-size: 1.08rem; max-width: 580px; margin: 0 auto 28px; }
  .hero-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--accent); color: #fff; text-decoration: none;
    padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: .95rem;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost {
    background: #fff; color: var(--ink); text-decoration: none;
    padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: .95rem;
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { border-color: var(--ink); }

  /* Features */
  .features { border-block: 1px solid var(--line); background: var(--bg-soft); }
  .features-inner {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; max-width: 1100px; margin: 0 auto; padding: 22px 20px;
  }
  .feature { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: .9rem; font-weight: 600; }
  .feature span.ic { font-size: 1.3rem; }

  /* Sections */
  section { padding: 64px 0; }
  .section-head { text-align: center; margin-bottom: 36px; }
  .section-head h2 { font-size: clamp(1.5rem, 3.5vw, 2.1rem); font-weight: 800; letter-spacing: -.01em; }
  .section-head p { color: var(--muted); margin-top: 6px; }

  /* Filters */
  .filters { display: flex; gap: 10px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 9px 18px; border-radius: 999px; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Product grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 26px 20px 20px; display: flex; flex-direction: column;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .card:hover { box-shadow: 0 12px 28px rgba(17,24,39,.10); transform: translateY(-3px); }
  .card-emoji { font-size: 2.6rem; margin-bottom: 14px; }
  .card .game { font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
  .card h3 { font-size: 1.02rem; font-weight: 700; margin: 4px 0; }
  .card-desc { font-size: .85rem; color: var(--muted); flex: 1; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .price { font-weight: 800; font-size: .95rem; white-space: nowrap; }
  .btn-add {
    border: 0; cursor: pointer; background: var(--ink); color: #fff;
    padding: 9px 14px; border-radius: 999px; font-size: .8rem; font-weight: 700;
  }
  .btn-add:hover { background: var(--accent); }

  /* About */
  .about { background: var(--bg-soft); border-block: 1px solid var(--line); }
  .about-inner {
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center;
  }
  .about-inner .big-emoji { font-size: 5rem; text-align: center; }
  .about-stats { display: flex; gap: 28px; margin-top: 20px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  .stat span { font-size: .82rem; color: var(--muted); }

  /* Contact */
  .contact-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .contact-card {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 24px;
    text-align: center; background: #fff;
  }
  .contact-card .ic { font-size: 1.8rem; }
  .contact-card h3 { font-size: .98rem; margin: 10px 0 4px; }
  .contact-card p { font-size: .88rem; color: var(--muted); word-break: break-word; }

  /* Footer */
  footer { background: var(--ink); color: #fff; padding: 36px 20px; text-align: center; }
  footer p { opacity: .75; font-size: .88rem; }

  /* Cart drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(17,24,39,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 90;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 100%);
    background: #fff; z-index: 100; display: flex; flex-direction: column;
    transform: translateX(105%); transition: transform .28s ease;
    box-shadow: -12px 0 40px rgba(0,0,0,.12);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  .drawer-head h3 { font-size: 1.05rem; }
  .drawer-close { border: 0; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .cart-empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .cart-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-item .ci-emoji { font-size: 1.8rem; }
  .ci-info { flex: 1; }
  .ci-info b { font-size: .9rem; display: block; }
  .ci-info span { font-size: .8rem; color: var(--muted); }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-weight: 700; color: var(--ink);
  }
  .qty button:hover { border-color: var(--accent); color: var(--accent); }
  .qty span { font-weight: 700; font-size: .9rem; min-width: 18px; text-align: center; }
  .ci-remove { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 1rem; }
  .ci-remove:hover { color: var(--accent); }
  .drawer-foot { border-top: 1px solid var(--line); padding: 18px 20px; }
  .cart-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.05rem; margin-bottom: 14px; }
  .btn-checkout {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 700;
    padding: 13px; border-radius: 999px; border: 0; cursor: pointer; font-size: .95rem;
  }
  .btn-checkout:hover { background: var(--accent-dark); }
  .drawer-foot .note { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 10px; }

  /* Account */
  .account-btn {
    border: 1px solid var(--line); cursor: pointer;
    background: #fff; color: var(--ink); font-weight: 700;
    padding: 10px 14px; border-radius: 999px; font-size: .9rem;
  }
  .account-btn:hover { border-color: var(--accent); color: var(--accent); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 110;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease; padding: 20px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: #fff; border-radius: 20px; max-width: 430px; width: 100%;
    max-height: 86vh; overflow-y: auto; padding: 26px;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-head h3 { font-size: 1.2rem; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .tabs .tab { flex: 1; border: 0; background: #fff; padding: 10px; font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--muted); }
  .tabs .tab.active { background: var(--ink); color: #fff; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 12px; font-size: .92rem; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .acc-error { color: var(--accent); font-size: .85rem; font-weight: 600; min-height: 1.2em; text-align: center; margin-top: 10px; }
  .profile { text-align: center; margin-bottom: 18px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800; margin: 0 auto 10px;
  }
  .profile b { font-size: 1.1rem; display: block; }
  .profile .muted { color: var(--muted); font-size: .88rem; }
  .acc-stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 22px; }
  .acc-stats .stat { text-align: center; }
  .acc-stats .stat b { display: block; font-size: 1.2rem; font-weight: 800; color: var(--accent); }
  .acc-stats .stat span { font-size: .78rem; color: var(--muted); }
  .order-list h4 { font-size: 1rem; margin-bottom: 10px; }
  .order-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: .88rem; }
  .order-item .oi-head { display: flex; justify-content: space-between; font-weight: 700; gap: 10px; }
  .order-item .oi-items { color: var(--muted); font-size: .8rem; margin-top: 4px; white-space: pre-line; }
  .no-orders { text-align: center; color: var(--muted); font-size: .88rem; padding: 16px 0 6px; }
  .btn-outline {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: #fff; color: var(--ink); font-weight: 700;
    padding: 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: .92rem; margin-top: 14px;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  /* Mr Wallet */
  .wallet-card {
    border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(135deg, #faf5ff 0%, #fff 70%);
    padding: 16px; margin-bottom: 22px;
  }
  .wallet-head { display: flex; justify-content: space-between; align-items: center; }
  .wallet-bal { font-size: 1.15rem; color: var(--accent); }
  .wallet-history { margin-top: 12px; font-size: .8rem; color: var(--muted); }
  .wh-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .wh-item b.pos { color: #16a34a; }
  .wh-item b.neg { color: var(--accent); }
  .wallet-inst { font-size: .88rem; color: var(--muted); margin-bottom: 6px; }
  .wallet-natcash {
    background: var(--bg-soft); border: 1px dashed var(--line);
    border-radius: 12px; padding: 12px; text-align: center; font-size: .92rem; margin-top: 10px;
  }
  .amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .amount-chip {
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 12px; font-weight: 700; cursor: pointer; font-size: .95rem;
  }
  .amount-chip:hover { border-color: var(--accent); color: var(--accent); }
  .amount-chip.selected { border-color: var(--accent); color: var(--accent); background: #faf5ff; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-size: .88rem; font-weight: 600; z-index: 120;
    transition: transform .25s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    nav { display: none; }
    .about-inner { grid-template-columns: 1fr; }
    .about-inner .big-emoji { order: -1; }
  }
</style>
</head>

  // ---------- Stockage local (avec repli mémoire si indisponible) ----------
  const store = {
    _mem: {},
    _ok: (function(){ try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e) { return false; } })(),
    get(k, d) {
      if (this._ok) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } }
      return (k in this._mem) ? this._mem[k] : d;
    },
    set(k, v) {
      if (this._ok) { try { localStorage.setItem(k, JSON.stringify(v)); return; } catch(e) {} }
      this._mem[k] = v;
    }
  };

  let users = store.get("mc_users", []);          // [{name, email, hash}]
  let session = store.get("mc_session", null);    // email de l'utilisateur connecté
  let orderHistory = store.get("mc_orders", {});  // email -> [{date, text, total}]
  let wallets = store.get("mc_wallets", {});       // email -> {balance, history}

  function hashPass(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "h" + (h >>> 0).toString(36);
  }

    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " HTG";

  function applyI18n() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[lang][key] !== undefined) el.textContent = t[lang][key];
    });
    document.documentElement.lang = lang === "fr" ? "fr" : "ht";
    document.getElementById("btnFr").classList.toggle("active", lang === "fr");
    document.getElementById("btnKr").classList.toggle("active", lang === "kr");
    renderProducts();
    renderCart();
    renderAccount();
    updateAccountUI();
  }

  // ---------- Cart ----------
  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
    showToast(t[lang].toast.added);
  }
  function changeQty(id, delta) {
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    renderCart();
  }
  function removeItem(id) {
    delete cart[id];
    renderCart();
  }

  function renderCart() {
    const ids = Object.keys(cart).map(Number);
    const count = ids.reduce((s, id) => s + cart[id], 0);
    document.getElementById("cartCount").textContent = count;

    const box = document.getElementById("cartItems");
    if (ids.length === 0) {
      box.innerHTML = `<div class="cart-empty">${esc(t[lang].cart.empty)}</div>`;
    } else {
      box.innerHTML = ids.map(id => {
        const p = products.find(x => x.id === id);
        return `
          <div class="cart-item">
            <span class="ci-emoji">${p.emoji}</span>
            <div class="ci-info">
              <b>${esc(p[lang].name)}</b>
              <span>${fmtPrice(p.price)}</span>
            </div>
            <div class="qty">
              <button onclick="changeQty(${id},-1)">−</button>
              <span>${cart[id]}</span>
              <button onclick="changeQty(${id},1)">+</button>
            </div>
            <button class="ci-remove" onclick="removeItem(${id})">🗑</button>
          </div>`;
      }).join("");
    }

    const total = ids.reduce((s, id) => s + cart[id] * products.find(x => x.id === id).price, 0);
    document.getElementById("cartTotal").textContent = fmtPrice(total);
    updateWalletPayButton(total, count);
  }

  function updateWalletPayButton(total, count) {
    const btn = document.getElementById("walletPayBtn");
    if (!btn) return;
    if (!session || count === 0) { btn.style.display = "none"; return; }
    const w = wallets[session] || { balance: 0 };
    btn.style.display = "block";
    btn.textContent = "💰 " + T("wallet.pay") + " — " + fmtPrice(w.balance);
  }

  function openCart() {

    document.getElementById("overlay").classList.add("open");

    document.getElementById("drawer").classList.remove("open");
    document.getElementById("overlay").classList.remove("open");

  function checkout(e) {
    e.preventDefault();
    const ids = Object.keys(cart).map(Number);
    if (ids.length === 0) return;
    const subject = "🎮 Nouvelle commande — Mr Clown Top Up Gaming";
    let total = 0;
    const lines = ids.map(id => {
      const p = products.find(x => x.id === id);
      total += cart[id] * p.price;
      return `- ${cart[id]}x ${p[lang].name} — ${fmtPrice(p.price * cart[id])}`;
    });
    if (session) {
      const my = orderHistory[session] || [];
      my.unshift({
        date: new Date().toLocaleDateString(lang === "fr" ? "fr-FR" : "en-US"),
        text: lines.join("\n"),
        total: total
      });
      orderHistory[session] = my;
      store.set("mc_orders", orderHistory);
    }
    const body = "Bonjour Mr Clown Top Up Gaming,\n\nJe souhaite commander :\n\n"
      + lines.join("\n") + "\n\n" + t[lang].cart.total + " : " + fmtPrice(total)
      + "\n\nMon pseudo / ID de jeu : \nMon numéro WhatsApp : ";
    window.location.href = "mailto:" + CONTACT_EMAIL
      + "?subject=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(body);
  }

  function selectAmount(a, btn) {
    topupAmount = a;

    if (btn) btn.classList.add("selected");

  function submitTopup(e) {
    e.preventDefault();
    const custom = parseInt(document.getElementById("customAmount").value, 10);
    const amount = (custom && custom >= 100) ? custom : topupAmount;
    const code = document.getElementById("transcode").value.trim().toUpperCase();
    if (!amount || amount < 100) return walletError(T("wallet.min"));
    if (!code) return walletError(T("wallet.errCodeEmpty"));
    if (!/^[A-Z0-9-]{6,20}$/.test(code)) return walletError(T("wallet.errCodeFormat"));
    const w = getWallet();
    if (!w) return;
    const alreadyUsed = Object.values(wallets).some(w2 =>
      (w2.history || []).some(h => h.code === code)
    );
    if (alreadyUsed) return walletError(T("wallet.errCodeUsed"));
    w.balance += amount;
    w.history.unshift({ type: "topup", amount: amount, date: todayStr(), code: code });
    saveWallet();
    walletError("");
    topupAmount = 0;
    renderWalletBody();
    renderAccount();
    renderCart();
    showToast(T("wallet.success") + " +" + amount + " HTG");
  }

  function payWithWallet() {
    const ids = Object.keys(cart).map(Number);
    if (ids.length === 0) return;
    const total = ids.reduce((s, id) => s + cart[id] * products.find(x => x.id === id).price, 0);
    const w = getWallet();
    if (!w) { showToast(T("wallet.needLogin")); openAccount(); return; }
    if (w.balance < total) { showToast(T("wallet.insufficient")); return; }
    const lines = ids.map(id => {
      const p = products.find(x => x.id === id);
      return "- " + cart[id] + "x " + p[lang].name + " — " + fmtPrice(p.price * cart[id]);
    });
    w.balance -= total;
    w.history.unshift({ type: "payment", amount: -total, date: todayStr() });
    saveWallet();
    const my = orderHistory[session] || [];
    my.unshift({ date: todayStr(), text: lines.join("\n"), total: total });
    orderHistory[session] = my;
    store.set("mc_orders", orderHistory);
    ids.forEach(id => delete cart[id]);
    renderAccount();
    renderCart();
    closeCart();
    showToast(T("wallet.paidDone"));
  }

          <div class="wallet-history">
            ${w.history.slice(0, 4).map(h => `
            <div class="wh-item"><span>${(h.type === "topup" ? T("wallet.typeTopup") + (h.code ? " · " + esc(h.code) : "") : T("wallet.typePayment"))} — ${esc(h.date)}</span><b class="${h.amount >= 0 ? "pos" : "neg"}">${h.amount >= 0 ? "+" : ""}${fmtPrice(h.amount)}</b></div>`).join("")}
          </div>` : ""}
        </div>
        <div class="acc-stats">
          <div class="stat"><b>${my.length}</b><span>${T("account.orderCount")}</span></div>
          <div class="stat"><b>${fmtPrice(spent)}</b><span>${T("cart.total")}</span></div>
        </div>
        <div class="order-list">
          <h4>${T("account.orders")}</h4>
          ${ordersHtml}
        </div>
        <button class="btn-outline" onclick="doLogout()">${T("account.logout")}</button>`;
    }
  }

  function accError(msg) {
    const el = document.getElementById("accError");
    if (el) el.textContent = msg;
  }

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById("accEmail").value.trim().toLowerCase();
    const pass = document.getElementById("accPass").value;
    if (!email || !pass) return accError(T("account.errFill"));
    const user = users.find(u => u.email === email && u.hash === hashPass(pass));
    if (!user) return accError(T("account.errEmail"));
    session = email;
    store.set("mc_session", session);
    renderAccount();
    updateAccountUI();
    showToast(T("account.welcome") + " " + user.name + " 👋");
  }

  function doSignup(e) {
    e.preventDefault();
    const name = document.getElementById("accName").value.trim();
    const email = document.getElementById("accEmail").value.trim().toLowerCase();
    const pass = document.getElementById("accPass").value;
    if (!name || !email || !pass) return accError(T("account.errFill"));
    if (pass.length < 6) return accError(T("account.errPass"));
    if (users.some(u => u.email === email)) return accError(T("account.errExists"));
    users.push({ name: name, email: email, hash: hashPass(pass) });
    store.set("mc_users", users);
    session = email;
    store.set("mc_session", session);
    renderAccount();
    updateAccountUI();
    showToast(T("account.welcome") + " " + name + " 👋");
  }

  function doLogout() {
    session = null;
    store.set("mc_session", null);
    accMode = "login";
    renderAccount();
    updateAccountUI();
    showToast(T("account.bye"));
  }

  function updateAccountUI() {
    const label = document.getElementById("accountLabel");
    if (!label) return;
    if (session) {
      const user = users.find(u => u.email === session);
      label.textContent = user ? user.name.split(" ")[0] : session;
    } else {
      label.textContent = T("account.guest");
    }
  }

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  // ---------- Init ----------
  applyI18n();
  setFilter("all");
</script>
</body>
</html>
